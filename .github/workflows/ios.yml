name: iOS CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (simulator, unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/ci-derived-data
      RESULT_BUNDLE_PATH: ${{ github.workspace }}/ci-results/tests.xcresult
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # Pick the newest installed Xcode on the runner instead of
        # hard-coding a version that may not exist.
        run: |
          set -euo pipefail
          LATEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting ${LATEST}"
          sudo xcode-select -s "${LATEST}/Contents/Developer"
          xcodebuild -version

      - name: Whitespace check
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD || true

      - name: Secret scan
        run: bash scripts/verify_no_secrets.sh

      - name: List schemes and resolve packages
        run: |
          set -euo pipefail
          xcodebuild -list -project Cryptory.xcodeproj
          xcodebuild -resolvePackageDependencies -project Cryptory.xcodeproj -scheme Cryptory-Dev

      - name: Build (unsigned)
        run: bash scripts/ci_build.sh Cryptory-Dev

      - name: Unit tests
        run: bash scripts/ci_test.sh

      - name: Focused realtime tests
        # Fast signal for the realtime pipeline in isolation; runs from the
        # DerivedData produced by the previous step.
        run: bash scripts/ci_test.sh CryptoryTests/MarketStreamEngineTests

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ github.workspace }}/ci-results
            ${{ github.workspace }}/ci-derived-data/build.log
          if-no-files-found: ignore
          retention-days: 14

# Known limitations (documented, not hidden):
# - GitHub-hosted macOS runners provide a limited set of Xcode versions and
#   iOS simulator runtimes. If the repository's deployment target (iOS 26.4)
#   is newer than the runner's newest simulator runtime, the build/test steps
#   will fail on the hosted runner even though they pass locally. In that
#   case run this workflow on a self-hosted runner with a matching Xcode, or
#   wait for runner images to catch up. See Docs/TEST_STRATEGY.md.
# - UI tests are not run in CI by default (simulator UI-test infrastructure
#   is flaky on shared runners); run them locally via
#   xcodebuild test -only-testing:CryptoryUITests.
# - No signing or App Store credentials are used anywhere in this workflow.
